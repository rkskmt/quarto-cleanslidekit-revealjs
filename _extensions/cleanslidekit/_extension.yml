title: CleanSlideKit RevealJS
author: rkskmt
version: 1.9.1
quarto-required: ">=1.4.0"
contributes:
  formats:
    revealjs:
      # --- Geometry & look (clean-revealjs derived) ---
      width: 1280
      height: 720
      margin: 0.06
      highlight-style: github
      scrollable: true
      menu: false
      footer: " "
      theme:
        - default
        - theme.scss
      # JP-friendly default; override in your document front matter if needed.
      lang: ja
      # Mermaid diagram defaults (tight spacing for slide real estate).
      mermaid:
        theme: default
        flowchart:
          nodeSpacing: 10
          rankSpacing: 15
      # Ship the CSS/JS UI kit alongside the rendered deck. format-resources
      # copies these flat into the output dir so the bare hrefs below resolve.
      format-resources:
        - custom.css
        - slide-ui.js
        - search-ui.js
        - peek-ui.js
        - badge-ui.js
        - toc-ui.js
      include-in-header:
        text: |
          <link rel="icon" type="image/svg+xml" href="favicon.svg">
          <link rel="stylesheet" href="custom.css">
          <script>
          // MathJax v2's HTML-CSS renderer (Quarto hardcodes config=TeX-AMS_HTML-full)
          // measures glyph widths in the live DOM, so when its TeX webfonts arrive
          // after typesetting (VSCode webviews, high-DPI Windows, slow networks) the
          // repaint leaves inline math wider than its reserved box and it overpaints
          // the neighboring text. The CommonHTML renderer lays out from built-in
          // metric tables and has no such race. Quarto offers no knob for this, so
          // trap the Reveal global (reveal.js loads later, in <body>) and rewrite
          // the math config before Reveal.initialize hands it to the math plugin.
          (function () {
            var reveal;
            Object.defineProperty(window, "Reveal", {
              configurable: true,
              get: function () { return reveal; },
              set: function (value) {
                reveal = value;
                if (!value || typeof value.initialize !== "function" || value.__cskCHTML) return;
                value.__cskCHTML = true;
                var initialize = value.initialize;
                value.initialize = function (config) {
                  if (config && config.math && typeof config.math.config === "string") {
                    config.math.config = config.math.config.replace("_HTML", "_CHTML");
                  }
                  return initialize.call(this, config);
                };
              }
            });
          })();
          </script>
          <script src="slide-ui.js" defer></script>
          <script src="search-ui.js" defer></script>
          <script src="peek-ui.js" defer></script>
          <script src="badge-ui.js" defer></script>
          <script src="toc-ui.js" defer></script>
      # Self-contained Lua filters. d2 and lightbox are intentionally NOT here:
      # they are separate extensions (see README) and would hard-fail rendering
      # if listed but not installed. Add them in your own _quarto.yml if wanted.
      filters:
        - slide-body.lua
        - card-grid.lua
        - hl.lua
        - cite-image.lua
        - plotly-iframe.lua
        - figscale.lua
